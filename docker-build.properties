# Configuración local para la construcción y publicación de la imagen Docker.
# Este archivo NO se versiona (ver .gitignore). Basado en docker-build.properties.example.
#
# NOTA: La versión (tag) de la imagen se toma automáticamente del "version"
# de package.json. Puede sobreescribirse con la variable de entorno VERSION.

# Nombre del repositorio de la imagen (sin registry ni tag).
IMAGE_NAME=redunica-front/frontend-visor-logs

# Registry principal donde se construye y publica la imagen.
REGISTRY_PRIMARY=registry.redunica.dev.corp

# Registry secundario al que se replica la imagen (re-tag + push).
REGISTRY_SECONDARY=registry.redunica.sac.dev.corp
